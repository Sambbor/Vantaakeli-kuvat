name: Kuvapankki
on:
  schedule:
    - cron: '23 * * * *'      # varalla; varsinainen tahti Kuvapankin ajastimesta (ajastin.yml), ks. vahti-työ
  workflow_dispatch:          # käsin käynnistys (testaus)
permissions:
  contents: write
concurrency: kuvapankki
jobs:
  # ka1 (3.11.2026): ajastettu (schedule) ajo on varalla – se ohitetaan, jos ajastimen käynnistämä ajo on alkanut alle 50 min sitten,
  # jotta samalta tunnilta ei tallennu kuvia kahdesti.
  vahti:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      aja: ${{ steps.v.outputs.aja }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          aja=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh run list --workflow kuvapankki.yml --event workflow_dispatch --limit 5 --json createdAt --jq '[.[] | select(now - (.createdAt | fromdateiso8601) < 3000)] | length' || echo 0)
            if [ "${n:-0}" -gt 0 ]; then aja=false; echo "Ajastin hoitaa kuvapankin – ajastettu varakeruu ohitetaan"; fi
          fi
          echo "aja=$aja" >> "$GITHUB_OUTPUT"
  collect:
    needs: vahti
    if: needs.vahti.outputs.aja == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Kuvankäsittelykirjasto
        run: python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet --break-system-packages pillow || (sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil)
      - name: Tallenna kuvat ja asemien mittaukset
        run: python3 kuvapankki.py
      - name: Tallenna säilöön
        run: |
          git config user.name "keli-bot"
          git config user.email "keli-bot@users.noreply.github.com"
          # Jos toinen ajo ehti tallentaa ensin (GitHub käynnistää joskus kaksi ajoa), ei yritetä yhdistää samoja
          # tiedostoja: siirrytään uusimpaan versioon ja ajetaan keruu uudelleen sen päälle.
          for i in 1 2 3; do
            for d in data img; do if [ -e "$d" ]; then git add "$d"; fi; done
            git diff --cached --quiet && exit 0
            git commit -q -m "Kuvapankki $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q && exit 0
            echo "Säilö muuttui ajon aikana – haetaan uusin versio ja kerätään uudelleen ($i)"
            sleep $((i*5))
            git fetch -q origin main && git reset -q --hard origin/main
            python3 kuvapankki.py || exit 1
          done
          exit 1
