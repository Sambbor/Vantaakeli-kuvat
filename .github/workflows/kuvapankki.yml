name: Kuvapankki
on:
  schedule:
    - cron: '23 * * * *'      # kerran tunnissa ympäri vuorokauden
  workflow_dispatch:          # käsin käynnistys (testaus)
permissions:
  contents: write
concurrency: kuvapankki
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Kuvankäsittelykirjasto
        run: python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet --break-system-packages pillow || (sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil)
      - name: Tallenna kuvat ja asemien mittaukset
        run: python3 kuvapankki.py
      - name: Tallenna säilöön
        run: |
          git config user.name "keli-bot"
          git config user.email "keli-bot@users.noreply.github.com"
          # Jos toinen ajo ehti tallentaa ensin (GitHub käynnistää joskus kaksi ajoa), ei yritetä yhdistää samoja
          # tiedostoja: siirrytään uusimpaan versioon ja ajetaan keruu uudelleen sen päälle.
          for i in 1 2 3; do
            for d in data img; do if [ -e "$d" ]; then git add "$d"; fi; done
            git diff --cached --quiet && exit 0
            git commit -q -m "Kuvapankki $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q && exit 0
            echo "Säilö muuttui ajon aikana – haetaan uusin versio ja kerätään uudelleen ($i)"
            sleep $((i*5))
            git fetch -q origin main && git reset -q --hard origin/main
            python3 kuvapankki.py || exit 1
          done
          exit 1
